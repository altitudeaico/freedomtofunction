<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register | Freedom to Function 2026</title>
<meta name="description" content="Register for Freedom to Function 2026 conference.">
<meta name="theme-color" content="#150c12">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon.png" sizes="180x180">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  @font-face{
    font-family:'HorizonCustom';
    src:url('https://4badb39f.customfonts.pages.dev/horizon.woff2') format('woff2');
    font-weight:normal;font-style:normal;font-display:swap;
  }

  :root{
    --pink:#ff66c4;
    --ink:#150c12;
    --cream:#f8f7ee;
    --gold:#e8c37e;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--ink);color:var(--cream);overflow-x:hidden;}
  img{max-width:100%;height:auto;}
  h1,h2,h3{margin:0;}

  header{padding:40px 20px;text-align:center;border-bottom:1px solid rgba(232,195,126,.16);}
  header h1{font-family:'HorizonCustom','Poppins',sans-serif;text-transform:uppercase;font-size:clamp(2rem,8vw,4rem);line-height:.95;margin-bottom:8px;color:var(--cream);}
  header p{font-size:.95rem;color:rgba(248,247,238,.72);margin:0;}

  .form-wrap{max-width:560px;margin:80px auto;padding:40px;border:1px solid rgba(255,102,196,.2);border-radius:8px;background:rgba(255,102,196,.01);}

  .form-group{margin-bottom:24px;}
  .form-group label{display:block;font-family:'Poppins';font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--gold);margin-bottom:8px;}
  .form-group input{width:100%;padding:14px 16px;border:1px solid rgba(255,102,196,.3);border-radius:4px;background:rgba(255,255,255,.02);color:var(--cream);font-family:'Poppins';font-size:1rem;transition:all .25s;}
  .form-group input:focus{outline:none;border-color:var(--pink);background:rgba(255,102,196,.05);}
  .form-group input::placeholder{color:rgba(248,247,238,.4);}

  .checkbox-group{margin-bottom:24px;}
  .checkbox-group .label{display:block;font-family:'Poppins';font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--gold);margin-bottom:12px;}
  
  .checkbox-list{display:grid;grid-template-columns:1fr;gap:10px;}
  .checkbox-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid rgba(255,102,196,.2);border-radius:4px;background:rgba(255,102,196,.01);cursor:pointer;transition:all .25s;}
  .checkbox-item:hover{border-color:rgba(255,102,196,.4);background:rgba(255,102,196,.05);}
  
  .checkbox-item input[type="checkbox"]{width:20px;height:20px;min-width:20px;margin-top:2px;cursor:pointer;accent-color:var(--pink);}
  .checkbox-item label{flex:1;margin:0;font-family:'Poppins';font-weight:400;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--cream);cursor:pointer;}
  .checkbox-item .date{display:block;font-size:.8rem;color:rgba(248,247,238,.6);margin-top:2px;}

  .submit-btn{width:100%;padding:16px;background:var(--pink);color:white;border:none;border-radius:4px;font-family:'Poppins';font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.9rem;cursor:pointer;transition:all .25s;box-shadow:0 12px 34px -14px rgba(255,102,196,.7);}
  .submit-btn:hover{background:#e5388f;box-shadow:0 16px 40px -10px rgba(255,102,196,.8);}
  .submit-btn:active{transform:translateY(1px);}

  .success{display:none;text-align:center;padding:40px 20px;}
  .success.show{display:block;}
  .success h2{font-family:'HorizonCustom','Poppins',sans-serif;text-transform:uppercase;font-size:2.4rem;line-height:.95;color:var(--cream);margin-bottom:16px;}
  .success p{font-size:.95rem;color:rgba(248,247,238,.78);max-width:60ch;margin:0 auto 24px;}
  .success a{display:inline-block;padding:12px 28px;background:var(--pink);color:white;text-decoration:none;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;}

  footer{text-align:center;padding:40px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:.78rem;color:rgba(248,247,238,.4);}

  @media(min-width:768px){
    header{padding:60px 32px;}
    .form-wrap{margin:120px auto;padding:48px;}
    .checkbox-list{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <h1>Register</h1>
  <p>Join us for Freedom to Function 2026</p>
</header>

<main>
  <div class="form-wrap">
    <form id="regForm">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+44 7123 456789">
      </div>

      <div class="checkbox-group">
        <div class="label">Which gathering(s) will you attend? *</div>
        <div class="checkbox-list">
          <div class="checkbox-item">
            <input type="checkbox" id="stop01" name="stops" value="Stop 01 - London">
            <label for="stop01">
              London
              <span class="date">Sunday 13 Sept · 10:00am</span>
            </label>
          </div>
          
          <div class="checkbox-item">
            <input type="checkbox" id="stop02" name="stops" value="Stop 02 - Oldham">
            <label for="stop02">
              Oldham
              <span class="date">Wednesday 16 Sept · 6:00pm</span>
            </label>
          </div>
          
          <div class="checkbox-item">
            <input type="checkbox" id="stop03" name="stops" value="Stop 03 - Erith">
            <label for="stop03">
              Erith (Fri)
              <span class="date">Friday 18 Sept · 7:00pm</span>
            </label>
          </div>
          
          <div class="checkbox-item">
            <input type="checkbox" id="stop04" name="stops" value="Stop 04 - Erith">
            <label for="stop04">
              Erith (Sun)
              <span class="date">Sunday 20 Sept · 10:30am</span>
            </label>
          </div>
          
          <div class="checkbox-item">
            <input type="checkbox" id="stop05" name="stops" value="Stop 05 - TBC">
            <label for="stop05">
              Stop 05
              <span class="date">TBC</span>
            </label>
          </div>
          
          <div class="checkbox-item">
            <input type="checkbox" id="stop06" name="stops" value="Stop 06 - TBC">
            <label for="stop06">
              Stop 06
              <span class="date">TBC</span>
            </label>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Register Now</button>
    </form>

    <div class="success" id="successMsg">
      <h2>You're In!</h2>
      <p>Thank you for registering for Freedom to Function 2026. Check your email for confirmation and event details.</p>
      <a href="index.html">Back to Event</a>
    </div>
  </div>
</main>

<footer>
  <p>&copy; Freedom To Function 2026 · All Rights Reserved</p>
</footer>

<script>
const form = document.getElementById('regForm');
form.addEventListener('submit', (e) => {
  e.preventDefault();
  
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const phone = document.getElementById('phone').value;
  
  // Get selected stops
  const selectedStops = Array.from(document.querySelectorAll('input[name="stops"]:checked'))
    .map(cb => cb.value);
  
  if (selectedStops.length === 0) {
    alert('Please select at least one gathering');
    return;
  }
  
  // Create tags for each selected stop
  const tags = [
    'F2F 2026 Registrant',
    ...selectedStops.map(stop => `F2F Attending - ${stop}`)
  ];
  
  // Store in sessionStorage
  sessionStorage.setItem('ftf_reg_name', name);
  sessionStorage.setItem('ftf_reg_email', email);
  sessionStorage.setItem('ftf_reg_phone', phone);
  sessionStorage.setItem('ftf_reg_tags', JSON.stringify(tags));
  
  // Show thank you
  form.style.display = 'none';
  document.getElementById('successMsg').classList.add('show');
});
</script>

</body>
</html>
